# ==============================================================================
# AI-ENABLED HOSPITAL RESOURCE AND EMERGENCY TRIAGE SYSTEM
# Spring Boot Configuration (CSA1104 - OOAD)
# ==============================================================================

server.port=8080
server.servlet.context-path=/
spring.application.name=hospital-emergency-triage-system

# JSON Configuration
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# ------------------------------------------------------------------------------
# DEFAULT PROFILE: H2 In-Memory Database (MySQL Compatibility Mode)
# This enables instant, zero-setup execution without pre-installing MySQL.
# To switch to local MySQL 8.0 server, run with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or update spring.profiles.active=mysql below.
# ------------------------------------------------------------------------------
spring.profiles.active=dev

# H2 Configuration (Simulating MySQL 8.0)
spring.datasource.url=jdbc:h2:mem:hospital_triage_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Hospital System Configuration Defaults
hospital.mode.busy-threshold=80.0
hospital.mode.surge-threshold=95.0
hospital.mode.surge-urgent-cases-limit=5
hospital.mode.surge-window-minutes=60

# Strategy Weightings for Bed Recommendation (Sum = 1.0)
hospital.bed-strategy.weight-priority=0.40
hospital.bed-strategy.weight-equipment=0.30
hospital.bed-strategy.weight-ward=0.20
hospital.bed-strategy.weight-distance=0.10
