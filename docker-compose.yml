version: '3.8'

services:
  # MySQL 8.0 Database Container
  mysql-db:
    image: mysql:8.0
    container_name: hospital-mysql
    restart: always
    environment:
      MYSQL_DATABASE: hospital_triage_db
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_USER: hospital_user
      MYSQL_PASSWORD: hospital_pass123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot & Web Application Container
  hospital-app:
    build: .
    container_name: hospital-triage-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/hospital_triage_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: hospital_user
      SPRING_DATASOURCE_PASSWORD: hospital_pass123
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql-data:
